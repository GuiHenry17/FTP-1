<meta charset="UTF-8">
<script>
    //faça um programa que gere a tabuada de um
    // número informado pelo usuário
    let i, num;
    num = Number(prompt(`Insira o número a ter a tabuada calculada:`))
    document.write(`<hr> Tabuada do número ${num} <hr>`);
    for( i = 1; i <= 10; i++){
        document.write(`${num} x ${i} = ${num * i} <br>`)
    }
</script>
