<meta charset="UTF-8">
<script>

    let num, menor, maior, soma = 0, pos = 0, par = 0, impar = 0
    document.write(`******** RELATÓRIO FINAL ********  <br>`)
    document.write(`Números informados:  <br>`)
    for (let i = 1; i <= 10; i++) {
        num = Number(prompt(`Insira a ${i}º número:`))

        if (i == 1) {
            maior = num
            menor = num
        } else {
            if (num < menor) menor = num
            if (num > maior) maior = num
        }

        if (num > 0) pos++


        if (num % 2 == 0) par++
        else impar++

        soma += num

        document.write(`${num}; `)
    }

    document.write(`<br> Soma: ${soma} <br>`)
    document.write(`Media: ${(soma / 10).toFixed(2)} <br>`)
    document.write(`Maior: ${maior} <br>`)
    document.write(`Menor: ${menor} <br>`)
    document.write(`Pares: ${par} <br>`)
    document.write(`Ímpares: ${impar} <br>`)
    document.write(`Percentual de Positivos: ${(pos / 10) * 100}% <br>`)





</script>
