<meta charset="UTF-8">
<script>

    let num, quant = 0
    num = Number(prompt(`Insira o número a ter seus divisores calculados:`))

    document.write(`******** RESULTADO ********   <br>`)
    document.write(`Número informado: ${num} <br><br>`)

    for (let i = 0; i <= num; i++) {
        if (num % i == 0) {
            quant++
            document.write(`Divisor encontrado: ${i} <br>`)
        }
    }

    document.write(`<br> Quantidade de divisores encontrados para o número informado: ${quant}`)



</script>
