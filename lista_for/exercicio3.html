<meta charset="UTF-8">
<script>

    let num, soma = 0

    document.write(`******** RELATÓRIO ********  <br>`)
    document.write(`Relação de números informados:  <br>`)
    for (let i = 1; i <= 10; i++) {
        num = Number(prompt(`Insira o ${i}º número:`))


        if (num > 0) soma += num
        document.write(`${i}º número informado: ${num} <br>`)
    }

    document.write(`Soma dos positivos: ${soma} `)






</script>
