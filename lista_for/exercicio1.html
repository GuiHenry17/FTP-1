<meta charset="UTF-8">
<script>

    let num
    num = Number(prompt(`Insira o número a ter a tabuada calculada:`))

    document.write(`******** TABUADA ********  <br>`)
    document.write(`Número: ${num} <br><br>`)

    for (let i = 1; i <= 10; i++) {
        document.write(`${num} x ${i} = ${num * i} <br>`)
    }



</script>
