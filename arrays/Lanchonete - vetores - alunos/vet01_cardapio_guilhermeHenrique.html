<main>
  <script>
    let produtos = [], precos = [], i, tam;

    alert(`Montando o Cardápio`);
    tam = Number(prompt(`Informe a quantidade de produtos do Cardápio`));

    //validação do tamanho 
    while (tam <= 0 || isNaN(tam)) {
      tam = Number(prompt(`Informe a quantidade de produtos do Cardápio`));
    }

    //opção1: preenchendo os vetores separados (produtos e preços)
    /* for (i = 0; i < tam; i++) {
      produtos[i] = prompt(`Informe o nome do ${i + 1}o. produto: `);
    }
    for (i = 0; i < tam; i++) {
      precos[i] = Number(prompt(`Informe o preço do ${i + 1}o. produto: `));
      
      //validação do preço
      while (precos[i] < 0 || isNaN(precos[i])) {
        precos[i] = Number(prompt("Valor inválido. Preço do produto " + (i + 1) + ": R$ "));
      }

    } */

    //opção2: preenchendo os vetores de forma intercalada

    for (i = 0; i < tam; i++) {
      produtos[i] = prompt(`Informe o nome do ${i + 1}o. produto: `);
      precos[i] = Number(prompt(`Informe o preço do ${i + 1}o. produto: `));

      //validação do preço
      while (precos[i] < 0 || isNaN(precos[i])) {
        precos[i] = Number(prompt("Valor inválido. Preço do produto " + (i + 1) + ": R$ "));
      }

    }


    // ── Saída ──────────────────────────────────────────────
    /*document.write("<h2 style='color:#E8821A;margin-bottom:12px'>Cardápio da Lanchonete</h2>");
    //opção1 - exibindo vetores separados
    for (i = 0; i < tam; i++) {
      document.write(`Produto ${i + 1}: ${produtos[i]} <br>`);
    }
    document.write(`<hr>Lista de Preços <hr>`);
    for (i = 0; i < tam; i++) {
      document.write(`Preço do produto ${i + 1}: R$ ${precos[i].toFixed(2)} <br>`);
    }*/

    //opção2 - exibindo produto e seu preço na sequência

    for (i = 0; i < tam; i++) {
      document.write(`Produto ${produtos[i]} ---  R$ ${precos[i].toFixed(2)} <br>`);
    }

  </script>
