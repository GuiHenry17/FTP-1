<meta charset="utf-8">
<script>
    function exibirBemVindo() {
        document.write("Bem-vindo à Lanchonete JS!<br>");
    }

    exibirBemVindo();
    exibirBemVindo();   // chamar 2x para mostrar reutilização


    /*Ponto de discussão: Chamamos exibirBemVindo() duas vezes sem reescrever nada. 
    Isso é reutilização de código — um dos maiores benefícios das funções. 
    Se a mensagem mudar, basta alterar dentro da função e todas as chamadas são atualizadas.*/

</script>
