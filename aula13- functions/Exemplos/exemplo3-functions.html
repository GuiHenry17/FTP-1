<script>

   let nomeLanche = prompt("Qual o lanche?");

   let preco = Number(prompt("Preço unitário (R$):"));

   let total = calcularTotal(preco, quantidade);

   document.write(`Pedido <br> Quantidade: ${quantidade} <br>
                    Produto: ${nomeLanche} <br>
                    Total: R$ ${total.toFixed(2)}`);

</script>
