<meta charset="utf-8">
<script>
    let prazoEntrega, horas, minutos
    do {
        prazoEntrega = Number(prompt(`Insira o prazo da entrega em minutos:`))
        if (prazoEntrega < 30 || prazoEntrega > 120) {
            alert(`Prazo inválido! Informe entre 30 e 120 minutos.`)
            document.write(`Prazo inválido! Informe entre 30 e 120 minutos. <br>`)
        } else {
            horas = Math.floor(prazoEntrega / 60)
            minutos = prazoEntrega % 60
        }
    } while (prazoEntrega < 30 || prazoEntrega > 120)

    document.write(`Entrega agendada: ${prazoEntrega} minutos (${horas}h ${minutos}min).`)


</script>
