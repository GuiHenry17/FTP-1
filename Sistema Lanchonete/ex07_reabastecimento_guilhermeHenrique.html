<meta charset="utf-8">
<script>
    let unidadesProduto, unidadesConfirmadas = 0
    do {
        unidadesProduto = Number(prompt(`Insira a quantidade de unidades a repor para o produto:`))
        console.log(unidadesProduto)
        if (unidadesProduto < 1 || unidadesProduto > 100) {
            alert(`Quantidade inválida! Informe entre 1 e 100.`)
            document.write(`Quantidade inválida! Informe entre 1 e 100. <br>`)
        } else unidadesConfirmadas += unidadesProduto
    } while (unidadesProduto < 1 || unidadesProduto > 100)

    document.write(`Reabastecimento de ${unidadesConfirmadas} unidades confirmadas!`)


</script>
