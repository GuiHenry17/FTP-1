<meta charset="UTF-8">
<script>
    let codigo, tentativas = 0

    do {
        codigo = parseInt(prompt("Digite o código de acesso:"))
        tentativas++

        if (codigo != 1234) {
            alert("Código incorreto!")
        }

    } while (codigo != 1234)

    document.write("Acesso liberado! <br>")
    document.write(`Tentativas realizadas: ${tentativas}`)
</script>
