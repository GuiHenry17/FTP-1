<meta charset="UTF-8">
<script>
    let opcao, n1, n2

    do {
        opcao = parseInt(prompt(
            "1 - Somar\n2 - Subtrair\n3 - Multiplicar\n4 - Sair"
        ))

        if (opcao >= 1 && opcao <= 3) {
            n1 = parseFloat(prompt("Digite o primeiro número:"))
            n2 = parseFloat(prompt("Digite o segundo número:"))

            let resultado

            if (opcao == 1) resultado = n1 + n2
            else if (opcao == 2) resultado = n1 - n2
            else resultado = n1 * n2

            document.write(`Resultado: ${resultado} <br><br>`)
        } else if (opcao != 4) {
            alert("Opção inválida!")
        }

    } while (opcao != 4)

    document.write("******* ENCERRADO ******* <br>")
    document.write("Obrigado por utilizar o sistema!")
</script>
