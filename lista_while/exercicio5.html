<meta charset="UTF-8">
<script>
    let numero, resposta

    while (true) {
        numero = parseInt(prompt("Digite um número para ver a tabuada:"))

        let i = 1
        while (i <= 10) {
            document.write(`${numero} x ${i} = ${numero * i} <br>`)
            i++
        }

        resposta = prompt("Deseja continuar? (sim/não)")

        if (resposta.toLowerCase() != "sim") break;
    }
</script>
