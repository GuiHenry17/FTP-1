<meta charset="UTF-8">
<script>
    let saldo = 0, saque
    while (saldo <= 0){
    saldo = parseFloat(prompt(`Digite o saldo inicial:`))
    }
    
    document.write("******* RELATÓRIO DE SAQUE *******  <br>")
    document.write(`Saldo Inicial: ${saldo} <br>`)
    while (true) {
        saque = parseFloat(prompt(`Digite o valor da saque a ser realizado ou 0 para parar:`))
        if (saque == 0) break;

        if (saque > saldo){
            alert(`Saque inválido! Deve ser menor ou igual ao saldo.`)
            saque = parseFloat(prompt(`Digite o valor da saque a ser realizado:`))
        }
        
        if (saldo > 0) {
        saldo -= saque
        document.write(`Operação de saque realizada! <br>
         Valor: ${saque} <br>
         Saldo: ${saldo} <br>`)
        } else {
            alert("Operação inválida! Saldo zerado, digite 0 para parar.")
        }
        

        
        
    }

</script>
