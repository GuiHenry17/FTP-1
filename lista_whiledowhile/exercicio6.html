<meta charset="UTF-8">
<script>
// Estrutura escolhida: do...while
// Justificativa: precisa executar pelo menos uma vez antes de perguntar

let resp

do {
    let n1 = parseFloat(prompt("Digite o primeiro número:"))
    let n2 = parseFloat(prompt("Digite o segundo número:"))

    let soma = n1 + n2

    document.write(`Resultado: ${soma} <br><br>`)

    resp = prompt("Deseja continuar? (sim/não)")

} while (resp.toLowerCase() == "sim")
</script>
