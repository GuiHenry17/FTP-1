<meta charset="UTF-8">
<script>
// Estrutura escolhida: while
// Justificativa: pode não haver nenhuma nota

let nota = 0, qtd = 0, soma = 0

while (nota != -1) {
    nota = parseFloat(prompt("Digite a nota (-1 para encerrar):"))

    if (nota >= 0 && nota <= 10) {
        soma += nota
        qtd++
    }
}

document.write("******* RELATÓRIO ******* <br>")

if (qtd > 0) {
    let media = soma / qtd
    document.write(`Quantidade de notas: ${qtd} <br>`)
    document.write(`Média: ${media.toFixed(2)}`)
} else {
    document.write("Sem dados para cálculo")
}
</script>
